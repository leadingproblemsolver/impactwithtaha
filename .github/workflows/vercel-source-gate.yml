name: Vercel Source Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          npm run test:syntax
          node --check scripts/browser-smoke.mjs
          node --check diagnostic/app.js
      - name: Validate Vercel contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          if (!config.regions?.includes('dxb1')) throw new Error('dxb1 region missing');
          for (const fn of ['api/analyze.js','api/event.js','api/health.js']) {
            if (!config.functions?.[fn]) throw new Error(`${fn} function contract missing`);
          }
          const routes = config.routes || [];
          if (!routes.some(r => r.src === '^/$' && r.dest === '/impact-v2.html')) throw new Error('root V2 route missing');
          if (!routes.some(r => r.src === '^/diagnostic/?$' && r.dest === '/diagnostic/index.html')) throw new Error('buyer diagnostic route missing');
          if (!routes.some(r => r.src === '^/(lens|work|proof-status|proof-map|method|resume|start)$' && r.dest === '/impact-v2.html')) throw new Error('canonical V2 route group missing');
          if (!routes.some(r => r.src === '^/proof/.*' && r.dest === '/impact-v2.html')) throw new Error('legacy proof routes must resolve through V2');
          if (fs.existsSync('api/analyze.mjs')) throw new Error('obsolete api/analyze.mjs still present');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.engines?.node !== '22.x') throw new Error('Node runtime must be pinned to 22.x');
          NODE
      - name: Validate canonical production files
        run: |
          test -s api/analyze.js
          test -s api/event.js
          test -s api/health.js
          test -s impact-v2.html
          test -s impact-v2.js
          test -s impact-llm.js
          test -s diagnostic/index.html
          test -s diagnostic/app.js
          test -s ARTIFACT_REGISTRY.json
          test -s scripts/production-smoke.mjs
          test -s scripts/browser-smoke.mjs

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production deployment and exercise runtime
        env:
          IMPACT_BASE_URL: https://impactwithtaha.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          SMOKE_RETRY_MS: '10000'
        run: node scripts/production-smoke.mjs --wait

  production-browser-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium smoke dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise production behavior in Chromium
        env:
          IMPACT_BASE_URL: https://impactwithtaha.vercel.app
        run: node scripts/browser-smoke.mjs
