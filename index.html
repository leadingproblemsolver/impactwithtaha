<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Taha Aslam — commercial systems, full-stack development, AI integration and evidence-grounded execution"><title>Taha Aslam — Work & Proof</title><style>:root{--bg:#080b0f;--panel:#11161d;--text:#f4f7fb;--muted:#a9b4c1;--line:#273241;--accent:#baff66;--blue:#76a9ff;--warn:#ffd166;--max:1120px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.58 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:var(--max);margin:auto;padding:0 22px}nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#080b0fee;z-index:20}.brand{text-decoration:none;font-weight:850}.nav{display:flex;gap:15px;flex-wrap:wrap}.nav a{text-decoration:none;color:var(--muted);font-size:14px}.hero{padding:82px 0 58px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(44px,7vw,78px);line-height:.98;letter-spacing:-.045em;margin:14px 0 22px;max-width:1050px}h2{font-size:clamp(28px,4vw,43px);letter-spacing:-.03em;margin:8px 0 25px}h3{font-size:20px;margin:8px 0}.lead{max-width:850px;font-size:clamp(18px,2.2vw,24px);color:var(--muted)}section{padding:56px 0;border-top:1px solid var(--line)}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:25px}.btn{display:inline-block;padding:11px 15px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-weight:750}.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0f08}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:21px}.card p,ul{color:var(--muted)}.more,.linklist a{color:var(--blue);font-weight:750}.metricrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.metric{border-top:1px solid var(--line);padding-top:10px}.metric b{display:block;font-size:27px}.metric span{font-size:13px;color:var(--muted)}.status{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:850;color:#b6ddff}.p4{color:#fff0a8}.p3{color:#c4f7c0}.boundary{padding:21px 23px;border-left:3px solid var(--accent);background:var(--panel);color:var(--muted);max-width:900px}.warn{border-left-color:var(--warn)}.flow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#0d1218;border:1px solid var(--line);border-radius:12px;padding:18px;color:#dbe7f5}.linklist{display:grid;gap:9px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:720px;background:var(--panel)}th,td{text-align:left;vertical-align:top;padding:13px;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;color:var(--muted)}footer{padding:48px 0 72px;color:var(--muted)}code{background:#111a24;padding:2px 5px;border-radius:5px}@media(max-width:820px){nav{position:static;padding:14px 0;align-items:flex-start}.grid,.grid3,.metricrow{grid-template-columns:1fr}.hero{padding-top:54px}h1{font-size:45px}.wrap{padding:0 18px}}@media print{nav,.actions,footer{display:none}body{background:#fff;color:#111}.lead,.card p,ul,.boundary{color:#333}.card,.boundary,.flow,table{background:#fff;color:#111;border-color:#ccc}}</style></head><body><div class="wrap"><nav><a class="brand" href="/">Taha Aslam / Work</a><div class="nav"><a href="/work">Work</a><a href="/execution">Execution</a><a href="/proof-status">Proof status</a><a href="/method">Method</a><a href="/resume">Resume</a><a href="/start">Start</a></div></nav><main id="app"></main><footer>Evidence-bounded work. Repository contents, offline validation, live external use and measured business outcomes are kept distinct.</footer></div><script>
const proof={
'commercial-systems':{name:'Commercial Systems Field Experiment',level:'P4 · external execution',lead:'Market intelligence → constraint diagnosis → buyer-facing system → real outreach → measurement plan.',body:`<p>Trucking driver recruiting is the first proving ground for the larger commercial-systems agenda. Account evidence is converted into constraint hypotheses, outreach/discovery questions, a buyer-facing diagnostic and an evidence/state ledger.</p><div class="actions"><a class="btn primary" href="https://gtm-attempt.netlify.app/">Live fieldwork ↗</a><a class="btn" href="https://gtm-attempt.netlify.app/demo">Direct demo ↗</a><a class="btn" href="https://gtm-attempt.netlify.app/intake">Intake ↗</a></div><p class="boundary warn">External execution is real. Paid demand, attributable meetings/pipeline, recruiting KPI change and ROI are not yet established.</p><h3>Next proof</h3><p>Primary operator evidence → paid/used diagnostic → baseline → intervention → post-state measurement.</p>`},
'driftguard':{name:'DriftGuard / Agent Session Settlement Preflight',level:'P2 · reproducible technical proof',lead:'Deterministic controls around long-running agent/session settlement.',body:`<p>Seven default settlement gates cover true settlement, continuation intent, transcript commit, stale generations, checkpoint survival, bounded waits and session/provider identity. Violating a blocking gate forces Block; missing proof cannot become Pass.</p><div class="actions"><a class="btn primary" href="https://github.com/leadingproblemsolver/driftguard">Repository ↗</a></div><p>Recorded evidence includes 52 release checks + 5 judgment tests and a separate recorded 24/24 benchmark with zero critical false passes and 17 unsupported passes prevented.</p><p class="boundary">No production adoption, prevented-incident or ROI claim is made without external evidence.</p>`},
'signalops':{name:'SignalOps + Market Intelligence Pipeline',level:'P2 · reproducible technical proof',lead:'Evidence ingestion, normalization, provenance, permission policy and durable next-action state.',body:`<p>SignalOps keeps observed language separate from interpretation, ranks relevance deterministically, applies channel-specific permission policy and produces restartable action/CRM-ready handoff state. The companion pipeline adds provider-neutral ingestion, retries, dedupe, provenance and deterministic exports.</p><div class="actions"><a class="btn primary" href="https://github.com/leadingproblemsolver/signalops-workbench">SignalOps repo ↗</a><a class="btn" href="https://github.com/leadingproblemsolver/market-intel-pipeline">Pipeline repo ↗</a></div><p class="boundary">Offline/reproducible behavior is proven. Live CRM automation, autonomous sending and production-scale provider reliability are not claimed.</p>`},
'tracecrumb':{name:'TraceCrumb First-60',level:'P3 · deployed product surface',lead:'Incident memory for the first diagnostic branch.',body:`<p>TraceCrumb turns live symptoms plus prior incident memory into a bounded first diagnostic branch. The repository includes demo/auth separation, telemetry hooks, fallback behavior and static/graph-domain test suites.</p><div class="actions"><a class="btn primary" href="https://tracecrumb.netlify.app/">Live product ↗</a><a class="btn" href="https://github.com/leadingproblemsolver/TraceCrumb">Repository ↗</a></div><p>Portfolio records retain 32 static checks + 45 graph/domain tests.</p><p class="boundary">No MTTR or first-action improvement claim is made until external operator outcome data supports it.</p>`},
'project-spec-compiler':{name:'Project Specification Compiler',level:'P2 · reproducible CLI proof',lead:'Executable controls for engineering project specifications.',body:`<p>Python CLI enforcing required sections, canonical status vocabulary, bundle/source/registry equality, repository-path warnings and deterministic portfolio reports.</p><div class="actions"><a class="btn primary" href="https://github.com/leadingproblemsolver/project-spec-compiler">Repository ↗</a></div>`},
'pathmeter':{name:'Pathmeter',level:'P2 · reproducible CLI proof',lead:'Measure idea → scaffolded → first-run → validated → shipped.',body:`<p>Local-first delivery instrumentation that records real milestones, executes configured validation gates, refuses failed work as shipped and reports recurring bottleneck stages.</p><div class="actions"><a class="btn primary" href="https://github.com/leadingproblemsolver/pathmeter">Repository ↗</a></div><p><strong>Next proof:</strong> repeated real cycles plus before/after cycle-time evidence after a targeted automation or process change.</p>`},
'multi-repo-hardening':{name:'Multi-Repo Engineering Hardening',level:'P2 · packaged technical proof',lead:'Portfolio-wide release discipline for AI-assisted repositories.',body:`<p>Multiple systems tightened around contracts, state integrity, security boundaries, validation, packaging and deployment-readiness. Earlier proof records preserve a five-system release with 50 automated tests, five installable wheels, five CLI entry points and five primary smoke workflows.</p><p class="boundary">Deployment-ready and offline-verified are not translated into client production use or prevented-incident claims.</p>`}
};
const pages={
'/':`<header class="hero"><p class="eyebrow">Commercial systems · AI integration · operational tooling</p><h1>I turn ambiguous operational problems into bounded systems people can inspect.</h1><p class="lead">I work across market intelligence, technical integration, workflow automation and product execution. This proof room separates reproducible work from deployment, external execution and measured commercial outcomes.</p><div class="actions"><a class="btn primary" href="/work">Inspect the work</a><a class="btn" href="/execution">Live GTM fieldwork</a><a class="btn" href="/resume">CV surface</a></div><div class="metricrow"><div class="metric"><b>7</b><span>primary proof surfaces</span></div><div class="metric"><b>P2–P4</b><span>current proof range</span></div><div class="metric"><b>1</b><span>active commercial field experiment</span></div><div class="metric"><b>0</b><span>invented KPI/ROI claims</span></div></div></header><section><p class="eyebrow">The mechanism</p><h2>Observe → diagnose → build → integrate → operate → measure → prove.</h2><div class="flow">market intelligence
→ valuable bottleneck
→ data / state / decision model
→ intervention
→ integration
→ real operation
→ technical + economic measurement
→ proof
→ leverage</div></section><section><p class="eyebrow">Evidence boundary</p><p class="boundary warn">Largest remaining gaps: end-to-end enrichment/CRM/routing execution on external data, repeated unaided Python/SQL/API/debugging reps, attributable meetings/pipeline, a paid/client-authorized deployment and a verified business outcome.</p></section>`,
'/work':`<header class="hero"><p class="eyebrow">Selected work</p><h1>Proof before adjectives.</h1><p class="lead">Technical claims route to reproducible repos/tests; market claims route to live fieldwork; missing outcomes stay visible.</p></header><section><div class="grid">${Object.entries(proof).map(([k,v])=>`<article class="card"><span class="status ${v.level.startsWith('P4')?'p4':v.level.startsWith('P3')?'p3':''}">${v.level}</span><h3>${v.name}</h3><p>${v.lead}</p><a class="more" href="/proof/${k}">Inspect →</a></article>`).join('')}</div></section><section><div class="linklist"><a href="https://github.com/leadingproblemsolver/repo_os_generator">Repo-OS Generator ↗</a><a href="https://github.com/leadingproblemsolver/chat-to-post-engine">Chat-to-Post Engine ↗</a><a href="https://decisionkillswitch.netlify.app/">DecisionKillSwitch live ↗</a></div></section>`,
'/execution':`<header class="hero"><p class="eyebrow">Current field experiment</p><h1>Commercial systems work in contact with reality.</h1><p class="lead">Trucking recruiting is the first proving ground for evidence → constraint → system → execution → measurement.</p><div class="actions"><a class="btn primary" href="https://gtm-attempt.netlify.app/">Landing ↗</a><a class="btn" href="https://gtm-attempt.netlify.app/demo">Demo ↗</a><a class="btn" href="https://gtm-attempt.netlify.app/intake">Intake ↗</a></div></header><section><div class="grid"><article class="card"><h3>Built / observed</h3><ul><li>Trucking ICP and account hypotheses</li><li>Constraint diagnostic workflow</li><li>Buyer-facing product surface</li><li>Outbound/call operators</li><li>Real outreach attempts</li><li>Evidence/state and measurement plan</li></ul></article><article class="card"><h3>Still unproven</h3><ul><li>Enough primary operator evidence</li><li>First paid diagnostic / willingness to pay</li><li>Real CRM enrichment/routing loop</li><li>Attributed meetings/pipeline</li><li>Recruiting KPI or economic change</li></ul></article></div></section><section><p class="boundary">The connected Netlify account reports <code>gtm-attempt</code> as a current ready deployment. Landing, <code>/demo</code> and <code>/intake</code> are product-contract URLs and should be re-verified in-browser after each deploy.</p></section>`,
'/proof-status':`<header class="hero"><p class="eyebrow">Claim registry</p><h1>What can be claimed today.</h1></header><section><div class="tablewrap"><table><tr><th>Level</th><th>Meaning</th><th>Current example</th></tr><tr><td>P1</td><td>Artifact exists</td><td>Prompts/operators/docs</td></tr><tr><td>P2</td><td>Reproducible technical behavior</td><td>DriftGuard, SignalOps, Spec Compiler, Pathmeter</td></tr><tr><td>P3</td><td>Deployed/usable surface</td><td>TraceCrumb / live apps</td></tr><tr><td>P4</td><td>External interaction</td><td>Commercial field experiment / contributions</td></tr><tr><td>P5</td><td>Measured outcome</td><td>Primary gap</td></tr><tr><td>P6</td><td>Economic outcome</td><td>Primary gap</td></tr></table></div></section><section><div class="grid"><article class="card"><h3>Commercial implementation</h3><p>Enrichment → scoring → CRM sync/routing → activation → replies/meetings.</p></article><article class="card"><h3>Technical independence</h3><p>Repeated Python/SQL/API/webhook/retry/debugging reps.</p></article><article class="card"><h3>Outcome</h3><p>Baseline → intervention → comparable post-state.</p></article><article class="card"><h3>External trust</h3><p>Paid/client deployment, testimonial, repeat use or accepted contribution.</p></article></div></section>`,
'/method':`<header class="hero"><p class="eyebrow">Reality / Work Actualization OS</p><h1>Capture work once. Compile it into proof many ways.</h1><p class="lead">Signals, hypotheses, actions, state transitions, failures and outcomes sit underneath the public surfaces.</p></header><section><div class="flow">REALITY
→ signals → evidence → hypothesis → constraint
→ next-information action → implementation
→ external execution → outcome → proof
→ distribution → response ingestion → updated reality</div></section><section><p class="boundary">Architecture is not user value. Offline tests are not production adoption. Deployment readiness is not production verification. Outreach infrastructure is not pipeline.</p></section>`,
'/resume':`<header class="hero"><p class="eyebrow">Canonical CV surface</p><h1>Taha Aslam — Commercial Systems & Full-Stack Developer.</h1><p class="lead">AI Integration · Automation · Evidence-Grounded Execution · Doha, Qatar</p><div class="actions"><a class="btn primary" href="mailto:leadingproblemsolver@gmail.com?subject=CV%20and%20evidence%20packet">Request / send CV packet</a><a class="btn" href="/links">Direct evidence</a><a class="btn" href="javascript:window.print()">Print / save</a></div></header><section><p class="boundary">Developer and BSc Data Science & AI student building bounded, testable systems across AI reliability, operational tooling, market intelligence and commercial workflows. Strongest evidence: translating ambiguous workflows into explicit state/data/decision contracts, implementing them as Python/TypeScript CLIs and web products, and keeping offline proof, deployment, external execution and measured outcomes separate.</p></section><section><div class="grid"><article class="card"><h3>Languages / data</h3><p>Python · TypeScript · JavaScript · SQL · Bash · pandas · SQLite · PostgreSQL/Supabase</p></article><article class="card"><h3>Web / integration</h3><p>React · Vite · Next.js routes · REST/JSON · Supabase Edge Functions · Redis · Docker · GitHub Actions</p></article><article class="card"><h3>Verification</h3><p>pytest/unittest · npm test · smoke/release gates · deterministic fixtures</p></article><article class="card"><h3>Education</h3><p>BSc Data Science & AI, University of Doha for Science & Technology, 2025–2029</p></article></div></section>`,
'/start':`<header class="hero"><p class="eyebrow">Next action</p><h1>Give me a real boundary to solve.</h1><p class="lead">A repo that will not ship, an AI workflow needing deterministic controls, a data pipeline needing provenance, or a commercial workflow needing an operating system.</p><div class="actions"><a class="btn primary" href="mailto:leadingproblemsolver@gmail.com?subject=Project%20or%20role%20inquiry">Email me</a><a class="btn" href="https://github.com/leadingproblemsolver">GitHub ↗</a><a class="btn" href="/resume">CV surface</a></div></header>`,
'/links':`<header class="hero"><p class="eyebrow">Direct URLs</p><h1>Everything important should be shareable directly.</h1></header><section><div class="linklist"><a href="https://github.com/leadingproblemsolver">GitHub profile ↗</a><a href="https://gtm-attempt.netlify.app/">GTM fieldwork landing ↗</a><a href="https://gtm-attempt.netlify.app/demo">GTM demo ↗</a><a href="https://gtm-attempt.netlify.app/intake">GTM intake ↗</a><a href="https://tracecrumb.netlify.app/">TraceCrumb live ↗</a><a href="https://decisionkillswitch.netlify.app/">DecisionKillSwitch live ↗</a><a href="https://driver-recruiting-diagnostic.netlify.app/">Driver recruiting diagnostic ↗</a><a href="https://github.com/leadingproblemsolver/driftguard">DriftGuard repo ↗</a><a href="https://github.com/leadingproblemsolver/signalops-workbench">SignalOps repo ↗</a><a href="https://github.com/leadingproblemsolver/market-intel-pipeline">Market Intel Pipeline repo ↗</a><a href="https://github.com/leadingproblemsolver/project-spec-compiler">Spec Compiler repo ↗</a><a href="https://github.com/leadingproblemsolver/pathmeter">Pathmeter repo ↗</a></div></section>`
};
function route(){let p=location.pathname.replace(/\/$/,'')||'/';const old={'/proof/driftguard.html':'/proof/driftguard','/proof/signalops-market-intel.html':'/proof/signalops','/proof/tracecrumb.html':'/proof/tracecrumb','/proof/multi-repo-hardening.html':'/proof/multi-repo-hardening','/proof/chat-to-post.html':'/work'};if(old[p]){history.replaceState(null,'',old[p]);p=old[p]}if(p.startsWith('/proof/')){const k=p.split('/')[2],v=proof[k];document.querySelector('#app').innerHTML=v?`<header class="hero"><p class="eyebrow">Case study</p><h1>${v.name}</h1><p class="lead">${v.lead}</p><span class="status">${v.level}</span></header><section>${v.body}</section><section><div class="actions"><a class="btn" href="/work">Back to work</a><a class="btn" href="/proof-status">Proof boundary</a></div></section>`:pages['/work'];return}document.querySelector('#app').innerHTML=pages[p]||`<header class="hero"><p class="eyebrow">404</p><h1>This route does not exist.</h1><div class="actions"><a class="btn primary" href="/work">Selected work</a><a class="btn" href="/links">Direct links</a></div></header>`}document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const h=a.getAttribute('href')||'';if(h.startsWith('/')&&!h.startsWith('//')){e.preventDefault();history.pushState(null,'',h);route();scrollTo(0,0)}});addEventListener('popstate',route);route();
</script></body></html>
